[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-compaction"
version = "0.1.0"
description = "Document-specific two-stage KV-cache compaction for Qwen3 and Llama-family models"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["latent_compaction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
