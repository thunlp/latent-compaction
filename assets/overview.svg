<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
  <title id="title">Latent Compaction with Test-Time Training</title>
  <desc id="desc">A frozen reader creates document supervision. Initialize a compact cache, fit attention for 1,000 updates, refine it for 1,000 updates, and reuse the cache to answer held-out questions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#f0f7f7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker>
  </defs>
  <rect x="1" y="1" width="1118" height="368" rx="24" fill="url(#bg)" stroke="#e2e8f0"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="40" y="44" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">COMPRESS THE DOCUMENT</text>
    <rect x="40" y="67" width="218" height="156" rx="15" fill="#fff" stroke="#dbe3ef"/>
    <rect x="60" y="87" width="33" height="38" rx="5" fill="#eef2ff" stroke="#c7d2fe"/>
    <path d="M68 98h17m-17 7h17m-17 7h11" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="153" font-size="19" font-weight="650" fill="#1e293b">Full document</text>
    <text x="60" y="177" font-size="13" fill="#64748b">Frozen language model</text>
    <text x="60" y="197" font-size="13" fill="#64748b">480 generic source prompts</text>
    <path d="M269 145h29" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="310" y="67" width="218" height="156" rx="15" fill="#fff" stroke="#dbe3ef"/>
    <g transform="translate(330 91)">
      <rect width="14" height="22" rx="3" fill="#a5b4fc"/><rect x="19" width="14" height="22" rx="3" fill="#a5b4fc"/>
      <rect x="38" width="14" height="22" rx="3" fill="#a5b4fc"/><rect x="57" width="14" height="22" rx="3" fill="#5eead4"/>
      <rect x="76" width="14" height="22" rx="3" fill="#fcd34d"/>
    </g>
    <text x="330" y="153" font-size="19" font-weight="650" fill="#1e293b">Initialize memory</text>
    <text x="330" y="177" font-size="13" fill="#64748b">Preservers · Anchors</text>
    <text x="330" y="197" font-size="13" fill="#64748b">Farthest-key diversifiers</text>
    <path d="M539 145h29" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="580" y="67" width="218" height="156" rx="15" fill="#fff" stroke="#c7d2fe"/>
    <rect x="600" y="89" width="77" height="27" rx="13" fill="#eef2ff"/>
    <text x="638" y="107" text-anchor="middle" font-size="12" font-weight="650" fill="#6366f1">STAGE 1</text>
    <text x="600" y="153" font-size="19" font-weight="650" fill="#1e293b">Fit attention</text>
    <text x="600" y="177" font-size="13" fill="#64748b">Match outputs + normalizers</text>
    <text x="600" y="197" font-size="13" font-weight="600" fill="#6366f1">1,000 updates per layer</text>
    <path d="M809 145h29" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="850" y="67" width="230" height="156" rx="15" fill="#fff" stroke="#99d9d2"/>
    <rect x="870" y="89" width="77" height="27" rx="13" fill="#e6f7f4"/>
    <text x="908" y="107" text-anchor="middle" font-size="12" font-weight="650" fill="#0f8b7c">STAGE 2</text>
    <text x="870" y="153" font-size="19" font-weight="650" fill="#1e293b">Refine the cache</text>
    <text x="870" y="177" font-size="13" fill="#64748b">Distill full-reader predictions</text>
    <text x="870" y="197" font-size="13" font-weight="600" fill="#0f8b7c">1,000 joint updates</text>
    <path d="M965 234v24" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="40" y="270" width="1040" height="64" rx="15" fill="#fff" stroke="#dbe3ef"/>
    <text x="62" y="309" font-size="12" font-weight="700" letter-spacing="1.4" fill="#64748b">REUSE THE CACHE</text>
    <path d="M226 302h35" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="282" y="308" font-size="16" font-weight="600" fill="#0f766e">One compact document memory</text>
    <path d="M568 302h35" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="624" y="308" font-size="16" fill="#334155">Many unseen questions, evaluated independently</text>
  </g>
</svg>
